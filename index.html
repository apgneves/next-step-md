    <div class="crisis-actions">
      <a href="tel:988">Call 988</a>
      <a href="sms:988">Text 988</a>
    </div>
  </div>
  <div class="crisis-extra" id="crisisExtra" hidden>
    <a href="#/help">Today looked hard. See support options on the Help page</a>
  </div>
</div>
